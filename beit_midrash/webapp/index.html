<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>עדים זוממים · שאלות</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Noto+Serif+Hebrew:wght@400;500;600&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efe8d8;
    --paper-raised: #f8f4e9;
    --paper-line: #d8cdb2;
    --ink: #2a2420;
    --ink-soft: #6b5f4f;
    --accent: #7a3242;
    --accent-strong: #5c2432;
    --bubble-user: #e4dcc5;
    --bubble-user-ink: #3a3120;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1a1613;
      --paper-raised: #221d19;
      --paper-line: #3a3129;
      --ink: #e9e1d1;
      --ink-soft: #ab9d86;
      --accent: #e08a9a;
      --accent-strong: #f0a8b6;
      --bubble-user: #2c2620;
      --bubble-user-ink: #e9e1d1;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Assistant", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1.2rem 1.5rem 1rem;
    border-bottom: 1px solid var(--paper-line);
    flex: none;
  }
  h1 {
    font-family: "Frank Ruhl Libre", serif;
    font-weight: 900;
    font-size: 1.8rem;
    margin: 0 0 .2rem;
  }
  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: .85rem;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 85%;
    padding: .8rem 1.1rem;
    border-radius: .7rem;
    line-height: 1.7;
    font-size: 1rem;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-start;
    background: var(--bubble-user);
    color: var(--bubble-user-ink);
    font-weight: 600;
  }
  .msg.assistant {
    align-self: flex-end;
    background: var(--paper-raised);
    border: 1px solid var(--paper-line);
    font-family: "Noto Serif Hebrew", serif;
  }
  .msg.error {
    align-self: flex-end;
    background: var(--paper-raised);
    border: 1px solid var(--accent);
    color: var(--accent-strong);
  }
  .msg.pending { color: var(--ink-soft); font-style: italic; }
  form {
    flex: none;
    display: flex;
    gap: .6rem;
    padding: 1rem 1.5rem 1.5rem;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    resize: none;
    font-family: "Assistant", sans-serif;
    font-size: 1rem;
    padding: .7rem .9rem;
    border-radius: .6rem;
    border: 1px solid var(--paper-line);
    background: var(--paper-raised);
    color: var(--ink);
    line-height: 1.5;
  }
  button {
    font-family: "Assistant", sans-serif;
    font-weight: 700;
    font-size: .95rem;
    padding: 0 1.3rem;
    border-radius: .6rem;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .empty {
    color: var(--ink-soft);
    text-align: center;
    margin-top: 2rem;
    font-size: .9rem;
  }
</style>
</head>
<body>
  <header>
    <h1>עדים זוממים · שאלות</h1>
    <p>שאלי כל שאלה על הסוגיה - התשובה תתבסס אך ורק על המקורות שכבר במאגר, עם ציון מראה מקום.</p>
  </header>
  <main id="log">
    <p class="empty">עדיין אין שאלות. אפשר להתחיל, למשל: "מה אומרת התורה על עדים זוממים?"</p>
  </main>
  <form id="form">
    <textarea id="input" rows="1" placeholder="הקלידי שאלה..." required></textarea>
    <button type="submit" id="send">שלח</button>
  </form>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  let started = false;

  function addMessage(role, text) {
    if (!started) { log.innerHTML = ''; started = true; }
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    addMessage('user', question);
    input.value = '';
    send.disabled = true;
    const pending = addMessage('assistant pending', 'חושב/ת...');

    try {
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'שגיאה לא ידועה');
      pending.textContent = data.answer;
      pending.className = 'msg assistant';
    } catch (err) {
      pending.textContent = 'שגיאה: ' + err.message;
      pending.className = 'msg error';
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
